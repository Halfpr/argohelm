apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-psql-config
data:
  POSTGRES_USER: "{{ .Values.psql.user }}"
  POSTGRES_DB: "{{ .Values.psql.db }}"
  POSTGRES_INITDB_ARGS: "{{ .Values.psql.initdbArgs }}"
  postgresql.conf: |
    listen_addresses = '*'
    max_connections = 1000
    shared_buffers = 128MB
    dynamic_shared_memory_type = posix
    max_wal_size = 1GB
    min_wal_size = 80MB
    datestyle = 'iso, mdy'
    timezone = UTC
    lc_messages = 'en_US.utf8'
    lc_monetary = 'en_US.utf8'
    lc_numeric = 'en_US.utf8'
    lc_time = 'en_US.utf8'
    log_timezone = UTC
